<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <article class="the-form">
      <header>
        <h1>Vui lòng liên hệ với chúng tôi</h1>
        <p>
          Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong vòng 24
          giờ.
        </p>
      </header>

      <form action="#" method="post" class="noi-dung-form">
        <div class="dong-2-cot">
          <div class="nhom-nhap">
            <label for="ho-ten">Họ và tên</label>
            <input
              type="text"
              id="ho-ten"
              name="ho-ten"
              placeholder="Nguyễn Văn An"
              required
            />
          </div>

          <div class="nhom-nhap">
            <label for="email">Email</label>
            <input
              type="email"
              ,
              id="email"
              ,
              placeholder="an.nv@tlu.edu.vn"
              required
            />
          </div>
        </div>

        <div class="dong-2-cot">
          <div class="nhom-nhap">
            <label for="dien-thoai">Số điện thoại</label>
            <input
              type="tel"
              id="dien-thoai"
              name="dien-thoai"
              placeholder="0987 654 321"
            />
          </div>

          <div class="nhom-nhap">
            <label for="chu-de">Chủ đề</label>
            <select name="chu-de" id="chu-de">
              <option value="khoa-hoc">Hỏi về khóa học</option>
              <option value="ky-thuat">Hỗ trợ kỹ thuật</option>
              <option value="khac">Khác</option>
            </select>
          </div>
        </div>

        <div class="nhom-nhap">
          <label for="noi-dung">Nội dung</label>
          <textarea
            name="noi-dung"
            id="noi-dung"
            rows="4"
            placeholder="Em muốn hỏi về lịch nộp tài tập môn lập trình web ạ."
          ></textarea>
        </div>

        <div class="hang-checkbox">
          <input type="checkbox" id="dong-y" name="dong-y" checked />
          <label for="dong-y">Tôi đồng ý nhận email phản hồi.</label>
        </div>

        <div class="hang-nut">
          <button type="submit" class="nut-gui">Gửi liên hệ</button>
          <button type="reset" class="nut-nhap-lai">Nhập lại</button>
        </div>
      </form>
    </article>
  </body>
</html>
