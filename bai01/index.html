<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width==device-width, initial-scale=1.0" />
    <title>Bốn mùa</title>
    <style>
      :root {
        --bg-khung: #fffde7;
        --border-khung: #9e9e9e;
        --bg-tieude: #ffd9e6;
        --mau-do: #d40000;
        --mau-xanh: #0033cc;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .khung-tho {
        width: 640px;
        background-color: var(--bg-khung);
        border: 1px solid var(--border-khung);
        padding: 24px;
        text-align: center;
      }
      .khung-tho h1 {
        color: var(--mau-do);
        background-color: var(--bg-tieude);
        font-size: 26px;
        padding: 6px 0;
        margin: 0px 0 20px 0;
      }
      .kho {
        font-style: italic;
        line-height: 1.7;
      }
      .xanh {
        color: var(--mau-xanh);
      }
      .do {
        color: var(--mau-do);
      }
      .khung-tho hr {
        width: 55%;
        border: none;
        border-top: 1px solid var(--mau-xanh);
        margin: 16px auto;
      }
    </style>
  </head>
  <body>
    <article class="khung-tho">
      <h1>BỐN MÙA</h1>

      <p class="kho xanh">
        Xuân về hoa nở khắp trời<br />
        Hạ sang nắng cháy rạng người phố quen<br />
        Thu về lá rụng bên thềm
      </p>

      <hr />

      <p class="kho do">
        Đông sang gió lạnh bên em đợi chờ<br />
        Bốn mùa là bốn giấc mơ<br />
        Thời gian đi mãi ta chờ đợi ai
      </p>

      <hr />

      <p class="kho xanh">
        Một năm rồi lại một năm<br />
        Vẫn còn một câu hát thì thầm quê hương<br />
        Chờ xuân năng mới soi đường
      </p>
    </article>
  </body>
</html>
