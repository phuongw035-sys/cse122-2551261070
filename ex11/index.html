<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thư viện ảnh Việt Nam</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="thu-vien">
      <head class="trang-dau">
        <h1>Thư viện ảnh Việt Nam</h1>
        <p>
          Bộ sưu tập 6 danh thắng tiêu biểu &mdash; minh họa thẻ figure /
          figcaption
        </p>
      </head>

      <div class="luoi-anh">
        <figure>
          <img src="images/hl.jpg" alt="Vịnh Hạ Long" />
          <figcaption>Hình 1. Vịnh Hạ Long</figcaption>
        </figure>

        <figure>
          <img src="images/sd.jpg" alt="Hang Sơn Đoòng" />
          <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
        </figure>

        <figure>
          <img src="images/bg.jpg" alt="Thác Bản Giốc" />
          <figcaption>Hình 3. Thác Bản Giốc</figcaption>
        </figure>

        <figure>
          <img src="images/Fansipan.jpg" alt="Fansipan" />
          <figcaption>Hình 4. Fansipan</figcaption>
        </figure>

        <figure>
          <img src="images/scl.jpg" alt="Đồng bằng sông Cửu Long" />
          <figcaption>Hình 5. Đồng bằng sông Cửu Long</figcaption>
        </figure>

        <figure>
          <img src="images/dpn.jpg" alt="Động Phong Nha" />
          <figcaption>Hình 6. Động Phong Nha</figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
